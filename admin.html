<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shafee Admin</title><style>body{margin:0;background:#fff8f8;color:#241c20;font-family:Arial,sans-serif}.wrap{max-width:1050px;margin:auto;padding:18px}.box{background:#fff;border:1px solid #ead7dd;border-radius:18px;padding:20px;box-shadow:0 8px 30px rgba(80,20,40,.08)}.brand{background:#64152f;color:#fff;border-radius:18px;padding:20px;margin-bottom:16px}.brand h1{margin:0 0 6px}.muted{color:#6f6469}.login{max-width:420px;margin:60px auto}.input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;box-sizing:border-box;margin:7px 0 12px;font:inherit}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}.primary{background:#64152f;color:#fff}.green{background:#159447;color:#fff}.red{background:#8c183e;color:#fff}.gray{background:#eee}.actions{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0}.row{display:grid;grid-template-columns:105px 1fr 130px 125px 150px;gap:12px;align-items:center;background:#fff;border:1px solid #ead7dd;border-radius:15px;padding:12px;margin:10px 0}.row img{width:95px;height:115px;object-fit:cover;border-radius:10px;background:#eee}.small{font-size:12px}.stock{font-weight:800}.stock.on{color:#159447}.stock.off{color:#8c183e}.file{font-size:12px}.status{display:flex;align-items:center;gap:7px}.check{width:20px;height:20px}.notice{padding:12px;border-radius:10px;background:#f7ecef;margin:10px 0}.hidden{display:none}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}@media(max-width:800px){.row{grid-template-columns:80px 1fr}.row img{width:75px;height:95px}.row .pricebox,.row .catbox,.row .stockbox{grid-column:2}} </style></head><body><div id="login" class="login box"><h1>Shafee Admin</h1><p class="muted">Manage your saree catalogue privately.</p><input id="pw" class="input" type="password" placeholder="Admin password" autocomplete="current-password"><button class="btn primary" onclick="login()">Login</button><div id="loginMsg" class="notice hidden"></div></div><div id="app" class="wrap hidden"><div class="brand"><div class="topline"><div><h1>Shafee Collection Manager</h1><div>Photos • Prices • Stock • Names • Categories</div></div><button class="btn gray" onclick="logout()">Logout</button></div></div><div class="box"><div class="topline"><div><b id="count">0 products</b><div class="muted small">Changes are saved to the live catalogue.</div></div><div class="actions"><button class="btn primary" onclick="addProduct()">+ Add Saree</button><button class="btn green" onclick="saveAll()">Save Changes</button></div></div><div id="msg" class="notice hidden"></div><div id="list"></div></div></div><script>let token=localStorage.getItem('shafee_admin_token')||'';let items=[];const $=id=>document.getElementById(id);function show(id){$(id).classList.remove('hidden')}function hide(id){$(id).classList.add('hidden')}async function api(path,opts={}){const h=new Headers(opts.headers||{});if(token)h.set('Authorization','Bearer '+token);const r=await fetch(path,{...opts,headers:h});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||'Request failed');return d}async function login(){try{const password=$('pw').value;const r=await fetch('/admin-api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',password})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Login failed');token=d.token;localStorage.setItem('shafee_admin_token',token);await load();hide('login');show('app')}catch(e){show('loginMsg');$('loginMsg').textContent=e.message}}async function load(){try{const d=await api('/admin-api');items=d.products||[];render()}catch(e){localStorage.removeItem('shafee_admin_token');token='';show('login');hide('app');show('loginMsg');$('loginMsg').textContent='Session expired. Please login again.'}}function render(){ $('count').textContent=items.length+' products';$('list').innerHTML=items.map((p,i)=>`<div class="row"><img src="${esc(p[0]||'')}" onerror="this.style.opacity=.3"><div><input class="input" value="${esc(p[1]||'')}" onchange="items[${i}][1]=this.value"><label class="file">Change photo: <input type="file" accept="image/*" onchange="items[${i}][5]=this.files[0]"></label></div><div class="pricebox"><label class="small">Price (₹)</label><input class="input" type="number" min="0" value="${p[2]??''}" placeholder="Enquiry" onchange="items[${i}][2]=this.value===''?null:Number(this.value)"></div><div class="catbox"><label class="small">Category</label><select class="input" onchange="items[${i}][4]=this.value"><option ${p[4]==='All'?'selected':''}>All</option><option ${p[4]==='Silk'?'selected':''}>Silk</option><option ${p[4]==='Cotton'?'selected':''}>Cotton</option><option ${p[4]==='Georgette'?'selected':''}>Georgette</option><option ${p[4]==='Chiffon'?'selected':''}>Chiffon</option></select></div><div class="stockbox"><label class="status"><input class="check" type="checkbox" ${p[3]!==false?'checked':''} onchange="items[${i}][3]=this.checked;render()"><span class="stock ${p[3]!==false?'on':'off'}">${p[3]!==false?'IN STOCK':'OUT OF STOCK'}</span></label><div class="actions"><button class="btn red" onclick="removeProduct(${i})">Remove</button></div></div></div>`).join('')}async function saveAll(){try{showMsg('Saving…');for(let i=0;i<items.length;i++){const f=items[i][5];if(f){const fd=new FormData();fd.append('file',f);const d=await api('/admin-api',{method:'POST',body:fd});items[i][0]=d.url;items[i][5]=null}}items=items.map(p=>p.slice(0,5));await api('/admin-api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'save',products:items})});render();showMsg('Saved successfully. The live website now uses the updated catalogue.')}catch(e){showMsg(e.message)}}function addProduct(){items.push(['','New Saree',null,true,'All',null]);render();window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}function removeProduct(i){if(confirm('Remove '+(items[i][1]||'this saree')+'?')){items.splice(i,1);render()}}function showMsg(t){show('msg');$('msg').textContent=t}function logout(){localStorage.removeItem('shafee_admin_token');location.reload()}function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;').replaceAll('>','&gt;')}if(token){load().then(()=>{hide('login');show('app')})}</script></body></html>
