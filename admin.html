<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shafee Admin</title><style>:root{--wine:#64152f;--line:#ead9dd;--green:#159447;--bg:#fff8f6;--muted:#756a6f}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:#24171d}.wrap{max-width:1050px;margin:auto;padding:18px}.top{background:var(--wine);color:#fff;border-radius:18px;padding:22px;margin-bottom:16px}.top h1{margin:0 0 5px}.login,.product{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}.login{max-width:520px;margin:30px auto}.input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font:inherit}.actions{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:var(--wine);color:#fff}.green{background:var(--green);color:#fff}.ghost{background:#fff;border:1px solid var(--line);color:#24171d;text-decoration:none}.danger{background:#9c2148;color:#fff}.muted{color:var(--muted);line-height:1.5}.product{display:grid;grid-template-columns:105px 1fr 1fr 150px;gap:12px;align-items:center}.product img{width:105px;height:130px;object-fit:cover;border-radius:11px;background:#eee}.field label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:5px}.stock{display:flex;gap:8px;align-items:center}.stock input{width:20px;height:20px}.status{font-size:12px;font-weight:800}.in{color:var(--green)}.out{color:#a21e45}.notice{padding:12px;border-radius:10px;background:#f8ecef;margin:10px 0}.hidden{display:none}@media(max-width:720px){.product{grid-template-columns:72px 1fr}.product img{width:72px;height:92px}.product .field,.product .actions2{grid-column:2}.top h1{font-size:25px}}</style></head><body><div class="wrap"><div class="top"><h1>Shafee Collection Manager</h1><div>Manage photos, names, prices and stock from your phone.</div></div><section id="login" class="login"><h2>Admin Login</h2><p class="muted">Enter your private admin password.</p><input id="password" class="input" type="password" placeholder="Admin password"><div class="actions"><button class="btn primary" onclick="login()">Login</button><a class="btn ghost" href="index.html">Back to website</a></div><div id="loginMsg" class="muted"></div></section><main id="app" class="hidden"><div class="actions"><button class="btn green" onclick="addProduct()">+ Add New Saree</button><button class="btn primary" onclick="saveAll()">Save All Changes</button><button class="btn ghost" onclick="loadProducts()">Refresh</button><a class="btn ghost" href="index.html">View Website</a></div><div id="msg" class="notice">Edit anything below, then press <b>Save All Changes</b>.</div><div id="list"></div></main></div><script>let products=[],uploads={},pass='';const $=id=>document.getElementById(id);function login(){pass=$('password').value;if(!pass)return $('loginMsg').textContent='Enter password.';loadProducts(true)}async function loadProducts(showApp=false){try{const r=await fetch('/api/products',{cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error||'Unable to load');products=d.products||[];uploads={};if(showApp){$('login').classList.add('hidden');$('app').classList.remove('hidden')}render()}catch(e){$('loginMsg').textContent=e.message}}function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;').replaceAll('>','&gt;')}function render(){list.innerHTML=products.map((p,i)=>`<article class="product"><img src="${esc(p.image)}" onerror="this.style.opacity=.25"><div class="field"><label>Product name</label><input class="input" value="${esc(p.name)}" oninput="products[${i}].name=this.value"></div><div class="field"><label>Price (₹) — blank = enquiry</label><input class="input" type="number" min="0" value="${p.price??''}" oninput="products[${i}].price=this.value===''?null:Number(this.value)"></div><div class="actions2"><label class="stock"><input type="checkbox" ${p.inStock!==false?'checked':''} onchange="products[${i}].inStock=this.checked;render()"><span class="status ${p.inStock!==false?'in':'out'}">${p.inStock!==false?'IN STOCK':'OUT OF STOCK'}</span></label><div class="actions"><label class="btn ghost">📷 Change Photo<input type="file" accept="image/*" hidden onchange="changePhoto(${i},this)"></label><button class="btn danger" onclick="removeProduct(${i})">Remove</button></div></div></article>`).join('')}function addProduct(){products.push({id:'p'+Date.now(),image:'',name:'New Saree',price:null,inStock:true});render();window.scrollTo(0,document.body.scrollHeight)}function removeProduct(i){if(confirm('Remove '+products[i].name+'?')){products.splice(i,1);render()}}function changePhoto(i,input){const file=input.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{const id='img_'+Date.now()+'_'+i;uploads[id]=reader.result;products[i].image='/api/products?image='+encodeURIComponent(id);render()};reader.readAsDataURL(file)}async function saveAll(){if(!pass)return;$('msg').textContent='Saving…';try{const r=await fetch('/api/products',{method:'POST',headers:{'content-type':'application/json','x-admin-password':pass},body:JSON.stringify({products,images:uploads})});const d=await r.json();if(!r.ok)throw Error(d.error||'Save failed');products=d.products;uploads={};$('msg').textContent='✓ Saved. The live website now uses these changes.';render()}catch(e){$('msg').textContent='❌ '+e.message}}</script></body></html>
